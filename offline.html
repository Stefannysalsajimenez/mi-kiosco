<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sin conexión</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #0d0d14;
      color: #f0f0f6;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem
    }

    .box {
      max-width: 380px
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: .75rem
    }

    p {
      color: #9898b0;
      font-size: .95rem;
      margin-bottom: 1.5rem
    }

    button {
      background: #f97316;
      color: #fff;
      border: none;
      padding: .75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer
    }

    button:hover {
      background: #ea6a0a
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>Revisa tu conexión a internet e intenta de nuevo.</p><button onclick="location.reload()">Reintentar</button>
  </div>
</body>

</html>
